function show(i){cur=(i+figs.length)%figs.length;var f=figs[cur],im=f.querySelector('.body'),p=im.dataset.p,g=f.dataset.g;
q('.big img').src=im.getAttribute('src');q('.num').textContent='№ '+f.querySelector('figcaption span').textContent;q('h2').textContent=f.querySelector('figcaption b').textContent;
q('.gtag').innerHTML=SV[g]+GN[g];q('.who').textContent=f.dataset.who?'Уже выбрал(а): '+f.dataset.who:'';q('.desc').textContent=f.dataset.desc;
q('.por').src=p;q('.ico').src=p;pop.classList.add('on');document.body.style.overflow='hidden'}
function hide(){pop.classList.remove('on');document.body.style.overflow=''}
q('.x').onclick=hide;q('.nav.l').onclick=function(e){e.stopPropagation();show(cur-1)};q('.nav.r').onclick=function(e){e.stopPropagation();show(cur+1)};
pop.addEventListener('click',function(e){if(e.target===pop)hide()});
document.addEventListener('keydown',function(e){if(!pop.classList.contains('on'))return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
var sx=null;pop.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});pop.addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)show(cur+(d<0?1:-1));sx=null});
})();
</script>
</body></html>
